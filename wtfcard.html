<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🃏 WTF Card V.1.0.1 稳定联机</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hidden { display: none !important; }
    .input-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      transition: 0.3s;
      min-width: 0;
    }
    input:focus {
      outline: none;
      border-color: #e94560;
      box-shadow: 0 0 0 3px rgba(233,69,96,0.2);
    }
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #e94560, #c23152);
      color: white;
      box-shadow: 0 4px 12px rgba(233,69,96,0.4);
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(233,69,96,0.6); }
    .btn:active { transform: translateY(0); }
    .btn:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #e94560;
      box-shadow: none;
      color: #e94560;
    }
    .btn-outline:hover { background: rgba(233,69,96,0.1); }
    .room-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 12px 16px;
      border-radius: 16px;
      margin: 15px 0;
      flex-wrap: wrap;
      gap: 10px;
    }
    .room-info span {
      background: rgba(233,69,96,0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
    .card-area { margin-top: 20px; }
    .black-card {
      background: #111;
      color: white;
      border: 2px solid #e94560;
      border-radius: 16px;
      padding: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .white-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px 18px;
      margin: 8px 0;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
      display: flex;
      align-items: center;
    }
    .white-card:hover {
      background: rgba(233,69,96,0.15);
      border-color: #e94560;
      transform: translateX(6px);
    }
    .white-card:active { transform: scale(0.98); }
    .free-card {
      border-style: dashed !important;
      border-color: #f9ca24 !important;
      color: #f9ca24;
      font-weight: 600;
      background: rgba(249,202,36,0.08);
    }
    .free-card:hover { background: rgba(249,202,36,0.2); }
    .white-card.judge-card {
      border-color: #f9ca24;
      background: rgba(249,202,36,0.1);
    }
    .white-card.readonly-card {
      cursor: default;
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
    }
    .answer-reveal {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px;
      margin: 6px 0;
      border-left: 4px solid #e94560;
    }
    .status-text { text-align: center; color: #aaa; padding: 20px; font-style: italic; }
    .reveal-phase {
      background: #1a1a2e;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }
    .reveal-phase .filled-text { font-size: 1.5rem; font-weight: bold; color: #f9ca24; margin: 15px 0; }
    .timer { color: #aaa; font-size: 1.2rem; }
    .announcement-btn {
      background: rgba(233,69,96,0.2);
      border: 1px solid rgba(233,69,96,0.4);
      color: #f9ca24; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .announcement-btn:hover { background: rgba(233,69,96,0.4); }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: #1e1e3a; border-radius: 16px; padding: 20px; width: 90%; max-width: 400px;
      border: 1px solid rgba(233,69,96,0.5);
    }
    .modal-content h3 { color: #f9ca24; margin-bottom: 10px; }
    .modal-content textarea {
      width: 100%; height: 100px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; border-radius: 8px; padding: 10px; font-size: 14px; resize: vertical;
    }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
    #leftPanelsContainer {
      position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 999;
    }
    .left-panel {
      width: 280px; background: rgba(20,20,40,0.9); backdrop-filter: blur(12px); border-radius: 16px;
      border: 1px solid rgba(233,69,96,0.5); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .panel-header {
      background: rgba(233,69,96,0.2); padding: 8px 12px; display: flex; justify-content: center;
      align-items: center; font-weight: bold; color: #f9ca24;
    }
    .player-list-content { max-height: 200px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .player-row {
      background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 10px; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .player-row .player-name { display: flex; align-items: center; gap: 6px; }
    .player-row .score { color: #f9ca24; font-weight: bold; }
    #chatFloatPanel { max-height: 300px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .chat-message {
      background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 10px; font-size: 13px; word-break: break-word;
    }
    .chat-message .sender { color: #e94560; font-weight: bold; margin-right: 4px; }
    .chat-input-row { display: flex; gap: 6px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
    .chat-input-row input {
      flex: 1; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 13px;
    }
    .chat-input-row .btn { padding: 6px 12px; font-size: 13px; }
    @media (max-width: 480px) {
      .container { padding: 20px 15px; }
      h1 { font-size: 2rem; }
      .btn { padding: 10px 16px; }
      .left-panel { width: 240px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div id="lobbyScreen">
    <h1>🃏 WTF Card</h1>
    <div class="input-row">
      <input type="text" id="nickname" placeholder="你的昵称（中英文数字）" maxlength="12">
    </div>
    <div class="input-row">
      <input type="text" id="customRoomId" placeholder="自定义房间号（留空自动生成）" maxlength="20">
    </div>
    <div class="input-row">
      <button class="btn" onclick="createRoom()">✨ 创建房间</button>
    </div>
    <div class="input-row">
      <input type="text" id="roomIdInput" placeholder="输入房间号">
      <button class="btn btn-outline" onclick="joinRoom()">🚪 加入</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h2 style="margin:0; font-size:1.6rem;">🃏 WTF Card</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="announcement-btn" onclick="openAnnouncement()">📢 公告</button>
        <button class="btn btn-outline" onclick="leaveRoom()" style="padding:8px 16px;">🚪 离开</button>
      </div>
    </div>
    <div class="room-info">
      <span>🏷️ 房间: <strong id="roomIdDisplay"></strong></span>
      <span>👤 <strong id="myNickDisplay"></strong></span>
      <span id="judgeDisplay" style="background: rgba(249,202,36,0.2);">⚖️ 裁判: <strong id="judgeNameDisplay"></strong></span>
    </div>
    <div>
      <button id="startBtn" class="btn" onclick="startRound()" disabled>▶️ 开始新一轮</button>
      <button id="restartBtn" class="btn btn-outline hidden" onclick="restartGame()">🔄 重启游戏</button>
    </div>
    <div id="gameArea" class="card-area"></div>
  </div>
</div>

<div id="leftPanelsContainer" style="display: none;">
  <div class="left-panel" id="playerListPanel">
    <div class="panel-header">👥 玩家</div>
    <div class="player-list-content" id="playerListContent"></div>
  </div>
  <div class="left-panel" id="chatFloatPanel">
    <div class="panel-header">💬 聊天室</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="说点什么..." maxlength="120">
      <button class="btn" onclick="sendChatMessage()">发送</button>
    </div>
  </div>
</div>

<div id="announcementModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>📢 房间公告</h3>
    <textarea id="announcementTextarea" readonly>暂无公告</textarea>
    <div class="modal-actions">
      <button id="editAnnouncementBtn" class="btn hidden" onclick="editAnnouncement()">✏️ 编辑</button>
      <button class="btn btn-outline" onclick="closeAnnouncement()">关闭</button>
    </div>
  </div>
</div>

<script>
  // ==================== 题库 ====================
  const blackCards = [
    "____是世界上最短的恐怖故事。",
    "我奶奶的葬礼上，大家突然开始聊____。",
    "教育部新规：中小学生每天必须学习____。",
    "让聊天立刻尴尬的终极武器是____。",
    "我在二手平台买到的最离谱的东西是____。",
    "网恋奔现时，对方从包里掏出了____。",
    "下次同学聚会，主题就叫____。",
    "真正让程序员崩溃的不是bug，而是____。",
    "我今年的年度总结：____。",
    "为了不上班，我假装____。",
    "深夜emo的终极解药是____。",
    "科学家发现，____能有效治疗精神内耗。",
    "结婚誓词里绝对不敢写____。",
    "室友半夜两点带回来了____。",
    "健身房最应该禁止的行为：____。",
    "我手机里绝对不能让别人看到的App：____。",
    "当AI觉醒后，它做的第一件事是____。",
    "宇宙的终极答案是____。",
    "那个被开除的同事，离职原因写的是____。",
    "我在海底捞过生日时，他们端出了____。",
    "朋友圈仅三天可见，是因为我发过____。",
    "真正的社恐，连____都害怕。",
    "这届年轻人的新型社交货币：____。",
    "电梯里只有你和老板，他突然问____。",
    "分手后，我把前任的____挂上了闲鱼。",
    "我发明了一个新职业：____体验师。",
    "为了显得合群，我学会了____。",
    "白银说的话，就像是一个____说的话一样。",
    "改变就是要____，而不是不改变！",
    "____救我！",
    "嘿，你的益达。不，是____。",
    "连一刻也没有为五条悟哀悼，下一个赶到战场的是____。",
    "事先说明，你才是____。",
    "哒哒哒哒哒，好想玩_____。",
    "月入八万，是因为我____。",
    "为了打瓦被叫宝宝，我只好____。",
    "因为____，我至今仍有心理阴影。",
    "根据野史记载，蜀汉灭亡的真正原因是____。",
    "老板！来一碗____不要葱花和香菜。",
    "都怪我的____太有魅力。",
    "妈，你把我的____放到哪里了？",
    "走在路上实在憋不住了，只好把屎拉在____里。",
    "我给朋友准备的生日礼物是____。"
  ];

  const whiteCards = [
    "我那一文不值的人生", "前男友的骨灰", "会说话的痔疮",
    "丁丁形状的意大利面", "郭敬明", "原味牛瘪火锅",
    "大肠刺身", "用脚抠出来的鼻屎", "半夜三点在厕所唱歌",
    "花呗账单", "前女友的结婚请帖", "亲戚家的熊孩子",
    "朋友圈仅三天可见", "奶茶里没有珍珠", "只用过一次的健身卡",
    "地铁上200%音量外放短视频", "60秒超长语音条", "群发牛子照片",
    "用豆包写入党申请书", "拼多多砍一刀链接", "被转发养生谣言",
    "电棍otto", "我的逆天生物钟", "MBTI测试结果为IMSB",
    "实验室制取核弹", "二手飞机杯", "嘉豪", "在公厕拉屎被敲门",
    "把公司厕所纸拿回家", "在电梯里放屁", "Steam游玩时长为0的游戏",
    "把《甄嬛传》当职场教科书", "美团年度账单里的恩格尔系数",
    "在KTV唱孤勇者", "跟豆包急眼", "把班主任拉进游戏开黑群",
    "用美颜相机拍身份证", "把工资条发到公司大群",
    "那个很久没上线的朋友", "网恋被骗八千", "卢本伟的番茄连招",
    "浏览器历史记录", "癌症晚期患者", "魔兽世界",
    "你的益达", "单亲妈妈离异带俩娃", "原神",
    "日本人", "河南人", "东北人", "开启省电模式","体育生的白袜","忘情牛肉面","辍学当主播","反向抽烟","小米SU7","国潮搜打撤","阿拉胡阿克巴","911","蓝月亮洗衣液畅饮","星之卡比","松弛的钢门","回归基本功","nigger","毛绒线裤","广东人","网购马卡龙买成马应龙","情趣棉袄",
  ];

  // ==================== 状态 ====================
  let peer, myId, myNick, hostId = null;
  let connections = {};
  let players = [];
  let scores = {};
  let isHost = false;
  let roundData = null;
  let myHand = [];
  let judgeId = null;
  let revealTimer = null;
  let localCountdownInterval = null;
  let shuffledWhiteCards = [];
  let usedBlackCards = new Set();
  let hasFreeCardThisRound = false;
  let currentAnnouncement = '';

  // ==================== 语音 ====================
  function speakText(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const chineseVoice = voices.find(v => v.lang.startsWith('zh-CN') || v.lang.startsWith('zh')) || voices[0];
    if (chineseVoice) utterance.voice = chineseVoice;
    window.speechSynthesis.speak(utterance);
  }

  // ==================== P2P 初始化（简化稳定版） ====================
  const iceServers = [
    { urls: 'stun:stun.qq.com:3478' },
    { urls: 'stun:stun.aliyun.com:3478' },
    { urls: 'stun:stun.l.google.com:19302' }, // 备用
    {
      urls: 'turn:openrelay.metered.ca:443',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    },
    {
      urls: 'turn:turn.anyfirewall.com:3478',
      username: 'webrtc',
      credential: 'webrtc'
    }
  ];

  function initPeer(peerId, callback) {
    try {
      peer = new Peer(peerId, {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        config: { iceServers }
      });
    } catch (e) {
      alert('创建连接失败，请刷新重试');
      return;
    }

    peer.on('open', id => {
      myId = id;
      console.log('✅ Peer ID:', id);
      if (callback) callback(id);
    });

    peer.on('connection', conn => {
      conn.on('open', () => {
        conn.on('data', data => onMessage(conn.peer, data));
        connections[conn.peer] = conn;
        if (isHost) {
          conn.send({ type: 'request-nick' });
          conn.send({ type: 'update-announcement', text: currentAnnouncement });
        }
      });
    });

    peer.on('error', err => {
      console.error('❌ Peer error:', err);
      if (err.type === 'unavailable-id') {
        alert('房间号已被占用，请换一个。');
      } else {
        alert('P2P 连接异常，请刷新重试');
      }
    });
  }

  function sendTo(pid, data) { if (connections[pid]) connections[pid].send(data); }
  function broadcast(data) { Object.keys(connections).forEach(id => sendTo(id, data)); }

  // ==================== 公告模态框 ====================
  function openAnnouncement() {
    document.getElementById('announcementTextarea').value = currentAnnouncement || '暂无公告';
    document.getElementById('announcementModal').classList.remove('hidden');
    if (isHost) document.getElementById('editAnnouncementBtn').classList.remove('hidden');
    else document.getElementById('editAnnouncementBtn').classList.add('hidden');
  }

  function closeAnnouncement() { document.getElementById('announcementModal').classList.add('hidden'); }

  function editAnnouncement() {
    if (!isHost) return;
    const textarea = document.getElementById('announcementTextarea');
    textarea.removeAttribute('readonly');
    textarea.focus();
    const btn = document.getElementById('editAnnouncementBtn');
    btn.textContent = '💾 保存';
    btn.onclick = saveAnnouncement;
  }

  function saveAnnouncement() {
    const textarea = document.getElementById('announcementTextarea');
    currentAnnouncement = textarea.value.trim();
    textarea.setAttribute('readonly', true);
    const btn = document.getElementById('editAnnouncementBtn');
    btn.textContent = '✏️ 编辑';
    btn.onclick = editAnnouncement;
    broadcast({ type: 'update-announcement', text: currentAnnouncement });
  }

  // ==================== 计分 ====================
  function updateScores(winnerId) {
    if (!scores[winnerId]) scores[winnerId] = 0;
    scores[winnerId] += 1;
    if (isHost) broadcast({ type: 'score-update', scores });
    updatePlayersUI();
  }

  function showLeftPanels() { document.getElementById('leftPanelsContainer').style.display = 'flex'; }

  function updatePlayersUI() {
    const container = document.getElementById('playerListContent');
    if (!container) return;
    container.innerHTML = players.map(p => {
      const isJudge = (p.id === judgeId);
      const score = scores[p.id] || 0;
      const hostMark = (p.id === hostId) ? ' 👑' : '';
      const judgeMark = isJudge ? ' ⚖️' : '';
      return `<div class="player-row">
        <span class="player-name">🟢 ${p.nick}${hostMark}${judgeMark}</span>
        <span class="score">${score}分</span>
      </div>`;
    }).join('');
    const judge = players.find(p => p.id === judgeId);
    document.getElementById('judgeNameDisplay').textContent = judge ? judge.nick : '???';
    refreshStartButton();
  }

  function addChatMessage(sender, text) {
    const chatDiv = document.getElementById('chatMessages');
    const msgEl = document.createElement('div');
    msgEl.className = 'chat-message';
    msgEl.innerHTML = `<span class="sender">${escapeHtml(sender)}:</span> ${escapeHtml(text)}`;
    chatDiv.appendChild(msgEl);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const chatData = { type: 'chat-message', sender: myNick, text };
    addChatMessage(myNick, text);
    if (isHost) broadcast(chatData);
    else sendTo(hostId, chatData);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendChatMessage(); });
  });

  function isValidNickname(nick) { return /^[\u4e00-\u9fa5a-zA-Z0-9]+$/.test(nick); }

  function restartGame() {
    if (!isHost) return;
    clearTimers();
    roundData = null;
    myHand = [];
    scores = {};
    players.forEach(p => scores[p.id] = 0);
    usedBlackCards.clear();
    judgeId = myId;
    hasFreeCardThisRound = false;
    broadcast({ type: 'restart-game', judgeId: myId });
    updatePlayersUI();
    renderGame();
    document.getElementById('startBtn').classList.add('hidden');
    refreshStartButton();
    addChatMessage('系统', '🔄 游戏已重启，分数已重置。');
  }

  function onMessage(fromId, msg) {
    switch (msg.type) {
      case 'chat-message':
        addChatMessage(msg.sender, msg.text);
        if (isHost && fromId !== myId) Object.keys(connections).forEach(id => { if (id !== fromId) sendTo(id, msg); });
        break;
      case 'update-announcement':
        currentAnnouncement = msg.text || '';
        break;
      case 'restart-game':
        clearTimers();
        roundData = null;
        myHand = [];
        scores = {};
        players.forEach(p => scores[p.id] = 0);
        judgeId = msg.judgeId;
        hasFreeCardThisRound = false;
        updatePlayersUI();
        renderGame();
        document.getElementById('startBtn').classList.add('hidden');
        refreshStartButton();
        addChatMessage('系统', '🔄 游戏已重启，分数已重置。');
        break;
      case 'nick':
        if (isHost && !players.find(p => p.id === fromId)) {
          players.push({ id: fromId, nick: msg.nick });
          if (!scores[fromId]) scores[fromId] = 0;
          updatePlayersUI();
          broadcast({ type: 'player-list', players });
          sendTo(fromId, { type: 'player-list', players });
          sendTo(fromId, { type: 'score-update', scores });
          sendTo(fromId, { type: 'update-judge', judgeId });
          refreshStartButton();
          addChatMessage('系统', `${msg.nick} 加入了房间`);
        }
        break;
      case 'request-nick': sendTo(fromId, { type: 'nick', nick: myNick }); break;
      case 'player-list':
        players = msg.players;
        players.forEach(p => { if (!scores[p.id]) scores[p.id] = 0; });
        updatePlayersUI();
        refreshStartButton();
        break;
      case 'score-update': scores = msg.scores; updatePlayersUI(); break;
      case 'update-judge': judgeId = msg.judgeId; updatePlayersUI(); break;
      case 'request-start':
        if (fromId === judgeId && !roundData && !revealTimer) executeStartRound();
        break;
      case 'start-round':
        clearTimers();
        hasFreeCardThisRound = false;
        roundData = { question: msg.question, answers: {}, answersLocked: false, winnerSelected: false };
        if (myId !== judgeId && myHand.length === 5) renderGame();
        else if (myId === judgeId) renderGame();
        else document.getElementById('gameArea').innerHTML = '<div class="status-text">等待发牌...</div>';
        document.getElementById('startBtn').classList.add('hidden');
        break;
      case 'deal-hand':
        if (myId !== judgeId) {
          myHand = msg.hand;
          hasFreeCardThisRound = msg.hasFreeCard || false;
          if (roundData && !roundData.answers[myId]) renderGame();
        }
        break;
      case 'submit-answer':
        if (isHost && roundData && !roundData.answersLocked && fromId !== judgeId) {
          roundData.answers[fromId] = msg.answer;
          checkAllAnswersCollected();
        }
        break;
      case 'all-answers':
        if (!roundData) return;
        roundData.answers = msg.answers;
        if (myId === judgeId) renderJudgeView();
        else renderAllAnswersView(msg.answers);
        break;
      case 'judge-select':
        if (isHost) {
          if (!roundData || roundData.winnerSelected) return;
          roundData.winnerSelected = true;
          const winner = players.find(p => p.id === msg.winnerId);
          if (winner) {
            updateScores(msg.winnerId);
            startRevealPhase(msg.winnerId, msg.answer, winner.nick);
          }
        }
        break;
      case 'reveal-phase':
        clearTimers();
        showRevealPhase(msg.question, msg.filledText, msg.winnerNick, msg.secondsLeft);
        speakText(msg.filledText);
        break;
    }
  }

  function clearTimers() {
    if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
    if (localCountdownInterval) { clearInterval(localCountdownInterval); localCountdownInterval = null; }
  }

  function refreshStartButton() {
    const btn = document.getElementById('startBtn');
    if (!btn) return;
    if (!roundData && !revealTimer && myId === judgeId && players.length >= 2) {
      btn.classList.remove('hidden');
      btn.disabled = false;
    } else {
      btn.classList.add('hidden');
    }
  }

  function checkAllAnswersCollected() {
    if (!roundData || roundData.answersLocked) return;
    const nonJudgeCount = players.length - 1;
    const submittedCount = Object.keys(roundData.answers).length;
    if (submittedCount === nonJudgeCount) {
      roundData.answersLocked = true;
      broadcast({ type: 'all-answers', answers: roundData.answers });
      if (myId === judgeId) renderJudgeView();
      else renderAllAnswersView(roundData.answers);
    }
  }

  function reshuffleWhiteCards() { shuffledWhiteCards = [...whiteCards].sort(() => Math.random() - 0.5); }

  function dealCards() {
    const needed = (players.length - 1) * 5;
    if (shuffledWhiteCards.length < needed) reshuffleWhiteCards();
    const hands = {};
    const freeCards = {};
    for (const p of players) {
      if (p.id === judgeId) continue;
      hands[p.id] = shuffledWhiteCards.splice(0, 5);
      freeCards[p.id] = Math.random() < 0.05;
    }
    return { hands, freeCards };
  }

  function getRandomBlackCard() {
    const total = blackCards.length;
    const usedCount = usedBlackCards.size;
    const threshold = Math.ceil(total * 0.7);
    if (usedCount >= threshold) usedBlackCards.clear();
    const availableIndices = [];
    for (let i = 0; i < total; i++) if (!usedBlackCards.has(i)) availableIndices.push(i);
    if (availableIndices.length === 0) { usedBlackCards.clear(); for (let i = 0; i < total; i++) availableIndices.push(i); }
    const idx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
    usedBlackCards.add(idx);
    return blackCards[idx];
  }

  function startRevealPhase(winnerId, answer, winnerNick) {
    const question = roundData.question;
    const filledText = question.replace('____', answer);
    const secondsLeft = 10;
    broadcast({ type: 'reveal-phase', question, filledText, winnerNick, secondsLeft });
    showRevealPhase(question, filledText, winnerNick, secondsLeft);
    speakText(filledText);
    revealTimer = setTimeout(() => { revealTimer = null; advanceJudgeAndNext(); }, secondsLeft * 1000);
  }

  function showRevealPhase(question, filledText, winnerNick, initialSeconds) {
    const area = document.getElementById('gameArea');
    let seconds = initialSeconds;
    area.innerHTML = `
      <div class="reveal-phase">
        <div>🏆 本轮最佳来自 <strong>${winnerNick}</strong></div>
        <div class="filled-text">${filledText}</div>
        <div class="timer">⏳ ${seconds}秒后自动开始下一轮...</div>
      </div>`;
    if (localCountdownInterval) clearInterval(localCountdownInterval);
    localCountdownInterval = setInterval(() => {
      seconds--;
      const timerEl = document.querySelector('.timer');
      if (timerEl) {
        if (seconds > 0) timerEl.textContent = `⏳ ${seconds}秒后自动开始下一轮...`;
        else { timerEl.textContent = `⏳ 即将开始...`; clearInterval(localCountdownInterval); localCountdownInterval = null; }
      }
    }, 1000);
  }

  function advanceJudgeAndNext() {
    clearTimers();
    const currentIdx = players.findIndex(p => p.id === judgeId);
    const nextIdx = (currentIdx + 1) % players.length;
    judgeId = players[nextIdx].id;
    roundData = null;
    broadcast({ type: 'update-judge', judgeId });
    updatePlayersUI();
    document.getElementById('startBtn').classList.add('hidden');
    executeStartRound();
  }

  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function createRoom() {
    myNick = document.getElementById('nickname').value.trim() || '房主';
    if (!isValidNickname(myNick)) { alert('昵称只能包含中文、英文和数字！'); return; }
    const customId = document.getElementById('customRoomId').value.trim();
    isHost = true;
    currentAnnouncement = '';
    usedBlackCards.clear();
    initPeer(customId || undefined, (peerId) => {
      hostId = peerId;
      judgeId = peerId;
      players = [{ id: peerId, nick: myNick }];
      scores = { [peerId]: 0 };
      document.getElementById('roomIdDisplay').textContent = peerId;
      document.getElementById('myNickDisplay').textContent = myNick;
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('restartBtn').classList.remove('hidden');
      showLeftPanels();
      myHand = [];
      updatePlayersUI();
      renderGame();
    });
  }

  async function joinRoom() {
    myNick = document.getElementById('nickname').value.trim() || '玩家';
    if (!isValidNickname(myNick)) { alert('昵称只能包含中文、英文和数字！'); return; }
    const roomId = document.getElementById('roomIdInput').value.trim();
    if (!roomId) return alert('请输入房间号');
    hostId = roomId;
    isHost = false;
    initPeer(undefined, async (peerId) => {
      const conn = peer.connect(hostId, { reliable: true });
      conn.on('open', () => {
        connections[hostId] = conn;
        conn.on('data', data => onMessage(hostId, data));
        conn.send({ type: 'nick', nick: myNick });
        document.getElementById('roomIdDisplay').textContent = hostId;
        document.getElementById('myNickDisplay').textContent = myNick;
        document.getElementById('lobbyScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('restartBtn').classList.add('hidden');
        showLeftPanels();
        myHand = [];
        renderGame();
      });
    });
  }

  function leaveRoom() { if (peer) peer.destroy(); location.reload(); }

  function startRound() {
    if (myId !== judgeId || players.length < 2 || roundData || revealTimer) return;
    if (isHost) executeStartRound();
    else sendTo(hostId, { type: 'request-start' });
    document.getElementById('startBtn').classList.add('hidden');
  }

  function executeStartRound() {
    if (!isHost || players.length < 2) return;
    const { hands, freeCards } = dealCards();
    for (const p of players) {
      if (p.id === judgeId) continue;
      if (p.id === myId) { myHand = hands[p.id]; hasFreeCardThisRound = freeCards[p.id]; }
      else sendTo(p.id, { type: 'deal-hand', hand: hands[p.id], hasFreeCard: freeCards[p.id] });
    }
    const question = getRandomBlackCard();
    roundData = { question, answers: {}, answersLocked: false, winnerSelected: false };
    broadcast({ type: 'start-round', question });
    renderGame();
    document.getElementById('startBtn').classList.add('hidden');
  }

  function sendAnswer(answerText, isFreeCard = false) {
    if (!roundData || !answerText || roundData.answersLocked) return;
    if (myId === judgeId) return;
    if (roundData.answers[myId]) return;
    if (!isFreeCard) { const idx = myHand.indexOf(answerText); if (idx > -1) myHand.splice(idx, 1); }
    else hasFreeCardThisRound = false;
    roundData.answers[myId] = answerText;
    if (!isHost) sendTo(hostId, { type: 'submit-answer', answer: answerText });
    else checkAllAnswersCollected();
    document.getElementById('gameArea').innerHTML = `<div class="status-text">✅ 你选择了：<strong>${answerText}</strong><br>等待其他玩家...</div>`;
  }

  function submitAnswer(answer) { sendAnswer(answer, false); }

  function useFreeCard() {
    if (!hasFreeCardThisRound || myId === judgeId) return;
    const input = prompt('✏️ 输入你的自由答案（仅限本回合有效）：');
    if (input && input.trim() !== '') sendAnswer(input.trim(), true);
  }

  function selectWinnerByJudge(winnerId, answer, element) {
    if (element && element.getAttribute('data-selected') === 'true') return;
    if (element) element.setAttribute('data-selected', 'true');
    if (isHost) {
      if (roundData && !roundData.winnerSelected && judgeId === myId) {
        roundData.winnerSelected = true;
        const winner = players.find(p => p.id === winnerId);
        if (winner) { updateScores(winnerId); startRevealPhase(winnerId, answer, winner.nick); }
      }
    } else {
      sendTo(hostId, { type: 'judge-select', winnerId, answer });
      document.getElementById('gameArea').innerHTML = `<div class="status-text">⏳ 等待结果公布...</div>`;
    }
  }

  function renderGame() {
    const area = document.getElementById('gameArea');
    if (!roundData) {
      area.innerHTML = `<div class="status-text">${myId === judgeId ? '你是裁判，等待开始...' : '等待裁判开始...'}</div>`;
      return;
    }
    if (myId === judgeId) {
      area.innerHTML = `<div class="black-card">${roundData.question}</div><div class="status-text">⚖️ 你是裁判，等待玩家提交答案...</div>`;
      return;
    }
    if (roundData.answers[myId]) { area.innerHTML = `<div class="status-text">✅ 你的答案已提交，等待裁判裁决...</div>`; return; }
    if (myHand.length === 0 && !hasFreeCardThisRound) { area.innerHTML = `<div class="status-text">等待发牌...</div>`; return; }
    let html = `<div class="black-card">${roundData.question}</div><div style="font-weight:600; margin-bottom:8px;">👉 选择一张你的答案：</div>`;
    myHand.forEach(card => { html += `<div class="white-card" onclick="submitAnswer('${escapeHtml(card)}')">${card}</div>`; });
    if (hasFreeCardThisRound) html += `<div class="white-card free-card" onclick="useFreeCard()">✏️ 自由卡 — 输入你的神回复</div>`;
    area.innerHTML = html;
  }

  function renderJudgeView() {
    const area = document.getElementById('gameArea');
    let html = `<div class="black-card">${roundData.question}</div><h3 style="color:#f9ca24; margin-bottom:10px;">⚖️ 你是裁判，选出最绝的答案：</h3>`;
    for (let [id, ans] of Object.entries(roundData.answers)) {
      const nick = players.find(p => p.id === id)?.nick || '未知';
      html += `<div class="white-card judge-card" data-selected="false" onclick="selectWinnerByJudge('${id}', '${escapeHtml(ans)}', this)">👤 ${nick}：${ans}</div>`;
    }
    area.innerHTML = html;
  }

  function renderAllAnswersView(answers) {
    const area = document.getElementById('gameArea');
    let html = `<div class="black-card">${roundData.question}</div><div class="status-text">👀 等待裁判选择最佳答案...</div>`;
    for (let [id, ans] of Object.entries(answers)) {
      const nick = players.find(p => p.id === id)?.nick || '未知';
      html += `<div class="white-card readonly-card">👤 ${nick}：${ans}</div>`;
    }
    area.innerHTML = html;
  }

  window.onload = () => console.log('🃏 WTF Card V.1.0.1 稳定联机版就绪');
</script>
</body>
</html>
