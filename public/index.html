<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111214">
  <title>WTF Card Online</title>
  <link rel="icon" href="/assets/card-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=20260810-1">
</head>
<body>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <main id="lobbyView" class="lobby-view">
    <section class="lobby-panel" aria-labelledby="brandTitle">
      <div class="brand-lockup">
        <img src="/assets/card-mark.svg" alt="" width="72" height="72">
        <div>
          <h1 id="brandTitle">WTF Card</h1>
          <p>Online Edition</p>
        </div>
      </div>

      <div class="connection-line">
        <span id="lobbyConnectionDot" class="connection-dot"></span>
        <span id="lobbyConnectionText">正在连接服务器</span>
      </div>

      <div class="segmented" role="tablist" aria-label="进入方式">
        <button id="createModeBtn" class="segment active" type="button" role="tab" aria-selected="true">创建房间</button>
        <button id="joinModeBtn" class="segment" type="button" role="tab" aria-selected="false">加入房间</button>
      </div>

      <form id="lobbyForm" novalidate>
        <label class="field-label" for="nicknameInput">昵称</label>
        <input id="nicknameInput" class="text-input" maxlength="12" autocomplete="nickname" placeholder="中英文或数字">

        <div id="createRoomFields">
          <label class="field-label" for="customRoomInput">房间号</label>
          <input id="customRoomInput" class="text-input uppercase" maxlength="20" autocomplete="off" placeholder="留空自动生成">
        </div>

        <div id="joinRoomFields" class="hidden">
          <label class="field-label" for="joinRoomInput">房间号</label>
          <input id="joinRoomInput" class="text-input uppercase" maxlength="20" autocomplete="off" placeholder="输入房间号">
        </div>

        <p id="lobbyError" class="form-error" role="alert"></p>
        <button id="lobbySubmitBtn" class="primary-btn full-width" type="submit">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          <span>创建房间</span>
        </button>
      </form>
    </section>

    <div class="lobby-art" aria-hidden="true">
      <img src="/assets/card-stack.svg" alt="">
    </div>
  </main>

  <div id="gameView" class="game-view hidden">
    <header class="app-header">
      <a class="compact-brand" href="/" aria-label="WTF Card 首页">
        <img src="/assets/card-mark.svg" alt="" width="38" height="38">
        <span>WTF Card</span>
      </a>

      <div class="header-actions">
        <span id="gameConnection" class="status-pill">
          <span class="connection-dot"></span>
          <span>在线</span>
        </span>
        <button id="soundBtn" class="icon-btn" type="button" title="语音播报" aria-label="切换语音播报">
          <i data-lucide="volume-2" aria-hidden="true"></i>
        </button>
        <button id="announcementBtn" class="icon-btn" type="button" title="房间公告" aria-label="查看房间公告">
          <i data-lucide="megaphone" aria-hidden="true"></i>
          <span id="announcementDot" class="notification-dot hidden"></span>
        </button>
        <button id="leaveBtn" class="icon-btn danger" type="button" title="离开房间" aria-label="离开房间">
          <i data-lucide="log-out" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="game-layout">
      <section class="game-column" aria-label="游戏桌面">
        <div class="room-strip">
          <div>
            <span class="meta-label">房间</span>
            <strong id="roomCode">------</strong>
          </div>
          <button id="copyRoomBtn" class="icon-btn small" type="button" title="复制邀请链接" aria-label="复制邀请链接">
            <i data-lucide="copy" aria-hidden="true"></i>
          </button>
          <span class="room-divider"></span>
          <div>
            <span class="meta-label">裁判</span>
            <strong id="judgeName">等待中</strong>
          </div>
          <button id="restartBtn" class="secondary-btn compact hidden" type="button">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            <span>重启</span>
          </button>
        </div>

        <div id="gameStage" class="game-stage"></div>
      </section>

      <aside class="side-column">
        <section class="side-section players-section" aria-labelledby="playersHeading">
          <div class="section-heading">
            <h2 id="playersHeading">玩家</h2>
            <span id="playerCount" class="count-badge">0</span>
          </div>
          <div id="playerList" class="player-list"></div>
        </section>

        <section class="side-section chat-section" aria-labelledby="chatHeading">
          <div class="section-heading">
            <h2 id="chatHeading">聊天</h2>
          </div>
          <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" autocomplete="off" placeholder="说点什么">
            <button id="emojiBtn" class="icon-btn" type="button" title="选择表情" aria-label="选择表情" aria-controls="emojiPicker" aria-expanded="false">
              <i data-lucide="smile" aria-hidden="true"></i>
            </button>
            <button class="icon-btn accent" type="submit" title="发送" aria-label="发送消息">
              <i data-lucide="send" aria-hidden="true"></i>
            </button>
            <div id="emojiPicker" class="emoji-picker hidden" role="dialog" aria-label="常用表情"></div>
          </form>
        </section>
      </aside>
    </main>
  </div>

  <dialog id="announcementDialog" class="app-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-heading">
        <h2>房间公告</h2>
        <button class="icon-btn small" value="cancel" aria-label="关闭公告" title="关闭">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <textarea id="announcementInput" maxlength="500" readonly placeholder="暂无公告"></textarea>
      <div class="dialog-actions">
        <button id="saveAnnouncementBtn" class="primary-btn hidden" type="button">
          <i data-lucide="save" aria-hidden="true"></i>
          <span>保存</span>
        </button>
      </div>
    </form>
  </dialog>

  <dialog id="freeAnswerDialog" class="app-dialog compact-dialog">
    <form id="freeAnswerForm" class="dialog-shell">
      <div class="dialog-heading">
        <h2>自由答案</h2>
        <button id="closeFreeAnswerBtn" class="icon-btn small" type="button" aria-label="关闭" title="关闭">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
      <input id="freeAnswerInput" class="text-input" maxlength="80" autocomplete="off" placeholder="输入你的神回复">
      <div class="dialog-actions">
        <button class="primary-btn" type="submit">
          <i data-lucide="send" aria-hidden="true"></i>
          <span>提交</span>
        </button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/app.js?v=20260810-3"></script>
</body>
</html>
